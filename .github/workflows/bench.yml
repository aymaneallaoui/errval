name: bench

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    name: benchmarks on ${{ matrix.runtime }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, node]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: run
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then bun run bench/run.ts; else node bench/run.ts; fi
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.runtime }}
          path: bench/results/
