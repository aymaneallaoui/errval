name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:types
      - run: bun run build
      - name: types also compile under TypeScript 7
        run: bun run typecheck:next
      - name: published declarations work on TypeScript 5.5
        run: bun run typecheck:floor

  test-node:
    name: tests on node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: examples run under node
        if: matrix.node != 20
        run: for f in examples/*.ts; do node "$f"; done

  test-bun:
    name: tests on bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test
      - name: the same suite under bun's own test runner
        run: bun run test:bun
      - run: for f in examples/*.ts; do bun run "$f"; done

  test-deno:
    name: examples on deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: for f in examples/*.ts; do deno run --allow-env "$f"; done
